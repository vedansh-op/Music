name: Build Android APK

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download official Spotify App Remote SDK
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            "https://github.com/spotify/android-sdk/releases/download/v0.8.0-appremote_v2.1.0-auth/spotify-app-remote-release-0.8.0.aar" \
            -o app/libs/spotify-app-remote-release-0.8.0.aar

      - name: Run unit tests and build APK
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Print debug signing certificate SHA-1
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android -keypass android \
            | grep -E "SHA1:|SHA-1:|SHA256:|SHA-256:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedMusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
